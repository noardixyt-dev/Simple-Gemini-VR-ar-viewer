<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBS VR Passthrough</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Landscape Check */
        @media screen and (orientation: portrait) {
            #warning { display: flex; }
            #container { display: none; }
        }

        #warning {
            display: none;
            color: white;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
            gap: 10px; /* Slight separation between eyes */
        }

        .eye {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 40px; /* The rounded "YouTube VR" look */
            background: #000;
            margin: 10px;
        }

        video {
            position: absolute;
            height: 100%;
            width: 100%;
            object-fit: cover;
            /* Center the feed within the eye */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="warning">Please rotate your device to Landscape mode.</div>

    <div id="container">
        <div class="eye"><video id="leftEye" autoplay playsinline muted></video></div>
        <div class="eye"><video id="rightEye" autoplay playsinline muted></video></div>
    </div>

    <script>
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: "environment", // Use back camera
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const leftVideo = document.getElementById('leftEye');
                const rightVideo = document.getElementById('rightEye');
                
                leftVideo.srcObject = stream;
                rightVideo.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Camera access denied or not available.");
            }
        }

        // Initialize
        startCamera();
    </script>
</body>
</html>

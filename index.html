<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stereo AR - Fixed Tracking</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        #v { display: none; } /* Hidden video element */
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 5px; }
        .btn { padding: 12px; background: #fff; border: none; font-weight: bold; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <video id="v" playsinline muted></video>
    
    <div id="ui">
        <button id="start-btn" class="btn">1. START CAMERA</button>
        <button id="load-btn" class="btn" style="display:none;">2. LOAD .GLB</button>
        <input type="file" id="file-input" accept=".glb,.gltf" style="display:none;">
    </div>

    <script>
        let scene, camera, renderer, world, model, videoTexture;
        let p = new THREE.Vector3(0, 0, 0), q = new THREE.Quaternion();
        const eyeSep = 0.064; // Distance between eyes in meters

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
            });
            const video = document.getElementById('v');
            video.srcObject = stream;
            video.play();

            videoTexture = new THREE.VideoTexture(video);
            scene = new THREE.Scene();
            
            // Single tracking camera
            camera = new THREE.PerspectiveCamera(60, (window.innerWidth/2) / window.innerHeight, 0.01, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            world = new THREE.Group();
            scene.add(world);
            scene.add(new THREE.AmbientLight(0xffffff, 2.5));

            // Background Planes (Nailed to Camera)
            const bgGeom = new THREE.PlaneGeometry(4, 2.25); // 16:9 Aspect
            const bgMat = new THREE.MeshBasicMaterial({ map: videoTexture, depthTest: false, depthWrite: false });
            const bgL = new THREE.Mesh(bgGeom, bgMat);
            const bgR = bgL.clone();
            
            // Position them slightly apart so they align with eye-offset
            bgL.position.set(-eyeSep/2, 0, -2);
            bgR.position.set(eyeSep/2, 0, -2);

            // Device Tracking (Sensors + VIO logic)
            window.addEventListener('deviceorientation', (e) => {
                const euler = new THREE.Euler(THREE.MathUtils.degToRad(e.beta), THREE.MathUtils.degToRad(e.alpha), -THREE.MathUtils.degToRad(e.gamma), 'YXZ');
                q.setFromEuler(euler);
            });

            window.addEventListener('devicemotion', (e) => {
                let a = e.acceleration;
                p.x += (a.x || 0) * 0.005; 
                p.z -= (a.z || 0) * 0.005;
            });

            // Tap to Anchor the model to your floor
            window.addEventListener('touchstart', () => {
                if (model) {
                    const dir = new THREE.Vector3(0, 0, -2.5).applyQuaternion(camera.quaternion);
                    model.position.copy(camera.position).add(dir);
                    model.position.y = -1.5; 
                }
            });

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('load-btn').style.display = 'block';
            animate();
        }

        const fileInput = document.getElementById('file-input');
        document.getElementById('load-btn').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            new THREE.GLTFLoader().load(url, (gltf) => {
                if(model) world.remove(model);
                model = gltf.scene;
                model.position.set(0, -1.5, -3);
                world.add(model);
            });
        };

        function renderEye(eyeOffset, x, y, w, h) {
            renderer.setViewport(x, y, w, h);
            renderer.setScissor(x, y, w, h);
            renderer.setScissorTest(true);

            // Shift camera for 3D effect
            const originalPos = camera.position.clone();
            camera.translateX(eyeOffset);
            renderer.render(scene, camera);
            camera.position.copy(originalPos);
        }

        function animate() {
            requestAnimationFrame(animate);
            camera.quaternion.slerp(q, 0.1);
            camera.position.lerp(p, 0.1);

            const w = window.innerWidth;
            const h = window.innerHeight;

            // Render Left Eye (Left half of screen)
            renderEye(-eyeSep/2, 0, 0, w/2, h);
            
            // Render Right Eye (Right half of screen)
            renderEye(eyeSep/2, w/2, 0, w/2, h);
        }

        document.getElementById('start-btn').onclick = () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(init);
            } else { init(); }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Steady VR Passthrough</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #container {
            display: flex;
            transform: translateX(-40px); /* Adjust for your headset IPD */
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .eye {
            height: 60vh; 
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden; 
            border-radius: 40px; 
            margin: 10px;
            background: #000;
            border: 1px solid #333;
        }

        video {
            position: absolute;
            width: 140%; /* Extra room for stabilization drift */
            height: 140%;
            object-fit: cover;
            left: -20%;
            top: -20%;
            will-change: transform;
        }

        #ui {
            position: fixed;
            top: 10px; right: 10px;
            z-index: 1000;
        }

        button {
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button onclick="initApp()">START STABILIZED VR</button>
    </div>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        const videos = document.querySelectorAll('video');
        let offsetX = 0;
        let offsetY = 0;

        async function initApp() {
            // Hide button
            document.getElementById('ui').style.display = 'none';
            
            // Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 1920, height: 1080, frameRate: 60 }
                });
                videos.forEach(v => v.srcObject = stream);
            } catch (e) { alert("Camera error"); }

            // Gyroscope Access (iOS/Android)
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(registsOrientation);
            } else {
                registsOrientation('granted');
            }
        }

        function registsOrientation(state) {
            if (state === 'granted') {
                window.addEventListener('deviceorientation', (e) => {
                    // We calculate the drift
                    // Gamma = Left/Right Tilt
                    // Beta = Up/Down Tilt
                    
                    // The factor 1.2 is the 'stabilization strength'
                    // We use a simple centering force: 
                    // it moves opposite to head, but pulls back to 0
                    offsetX = e.gamma * -1.8;
                    offsetY = (e.beta - 75) * -1.8; // 75 is roughly holding phone in front of face

                    // Constrain so it never leaves the window
                    const limit = 60; 
                    offsetX = Math.max(-limit, Math.min(limit, offsetX));
                    offsetY = Math.max(-limit, Math.min(limit, offsetY));

                    updatePosition();
                });
            }
        }

        function updatePosition() {
            const transformStr = `translate(${offsetX}px, ${offsetY}px)`;
            videos.forEach(v => {
                v.style.transform = transformStr;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Sensor-Shift Calibration</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif;
        }

        #container { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; 
        }

        .eye {
            height: 38vh; width: calc(38vh * 1.77); 
            position: relative; overflow: hidden; border-radius: 35px; 
            background: #000; border: 2px solid #444;
            margin: 0 30px; 
        }

        video {
            position: absolute; width: 160%; height: 160%;
            object-fit: cover; left: -30%; top: -30%;
            will-change: transform;
            transition: none;
        }

        /* VR INTERFACE */
        #vr-ui {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999;
            display: none; flex-direction: column; justify-content: space-between;
        }

        .btn {
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.8);
            color: white; border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 30px; border-radius: 20px; font-size: 20px; font-weight: bold;
        }

        #top-bar { display: flex; justify-content: center; padding: 20px; }
        
        #mid-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 40px; flex-grow: 1; 
        }

        #stats-panel {
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00; padding: 15px; border-radius: 12px;
            border: 2px solid #00ff00; text-align: center;
            font-family: monospace; font-size: 18px; pointer-events: auto;
        }

        #start-overlay {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button class="btn" style="background: #1a73e8;" onclick="start()">ENTER CALIBRATION</button>
    </div>

    <div id="vr-ui">
        <div id="top-bar">
            <button class="btn" onclick="cycleMode()">MODE: <span id="mode-label">SPACING</span></button>
        </div>

        <div id="mid-bar">
            <button class="btn" onclick="adjust(-1)">MINUS [-]</button>
            
            <div id="stats-panel">
                <div id="stats-text">S:30 | V:0 | H:38</div>
            </div>

            <button class="btn" onclick="adjust(1)">PLUS [+]</button>
        </div>
    </div>

    <div id="container">
        <div class="eye" id="l-eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye" id="r-eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        // Configuration State
        let s = 30; // Spacing
        let v = 0;  // Vertical
        let h = 38; // Height/Scale
        let mode = 0; // 0:S, 1:V, 2:H
        const modes = ["SPACING", "VERTICAL", "HEIGHT"];

        const vids = document.querySelectorAll('video');
        const container = document.getElementById('container');
        const lEye = document.getElementById('l-eye');
        const rEye = document.getElementById('r-eye');

        function cycleMode() {
            mode = (mode + 1) % 3;
            document.getElementById('mode-label').innerText = modes[mode];
        }

        function adjust(dir) {
            if (mode === 0) s += (dir * 2);
            if (mode === 1) v += (dir * 4);
            if (mode === 2) h += (dir * 1);

            // Update DOM
            lEye.style.marginRight = s + "px";
            rEye.style.marginLeft = s + "px";
            container.style.transform = `translateY(${v}px)`;
            document.querySelectorAll('.eye').forEach(el => {
                el.style.height = h + "vh";
                el.style.width = `calc(${h}vh * 1.77)`;
            });

            document.getElementById('stats-text').innerText = `S:${s} | V:${v} | H:${h}`;
        }

        async function start() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('vr-ui').style.display = 'flex';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 1920, height: 1080, frameRate: 60 }
                });
                vids.forEach(vid => vid.srcObject = stream);
            } catch (err) { alert("Camera Error"); }

            // Initialize Sensor-Shift Logic
            if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(state => {
                    if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
                });
            } else {
                window.addEventListener('devicemotion', handleMotion);
            }
        }

        function handleMotion(e) {
            const x = (e.accelerationIncludingGravity.x || 0) * 6.5;
            const y = ((e.accelerationIncludingGravity.y || 0) - 5) * 6.5;
            vids.forEach(vid => {
                vid.style.transform = `translate(${x}px, ${y}px)`;
            });
        }
    </script>
</body>
</html>

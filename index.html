<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native VIO Passthrough</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        button { padding: 20px 40px; font-size: 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="overlay"><button id="btn">START NATIVE AR</button></div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { XRButton } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/webxr/XRButton.js';

        let camera, scene, renderer, cube;

        async function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Native VIO Light Estimation and Plane Tracking
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Cube object to verify VIO locking
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const material = new THREE.MeshNormalMaterial();
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 0, -0.5);
            scene.add(cube);

            document.body.appendChild(XRButton.createButton(renderer, { 
                requiredFeatures: ['hit-test', 'local-floor'] 
            }));

            renderer.setAnimationLoop((timestamp, frame) => {
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            });
        }

        document.getElementById('btn').onclick = () => {
            document.getElementById('overlay').style.display = 'none';
            init();
        };
    </script>
</body>
</html>

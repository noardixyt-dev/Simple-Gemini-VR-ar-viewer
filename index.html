<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>0.5x Ultra-Wide Production VIO Engine</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #container {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transform: translate(-5px, 10px); /* Custom lens physical calibration */
        }
        .eye {
            height: 45vh;
            width: calc(45vh * 1.77);
            position: relative; overflow: hidden; border-radius: 40px;
            background: #111; /* Slight dark gray placeholder to prove canvas visibility */
            margin: 0 24px; /* S:24 lens gap */
            border: 1px solid #222;
        }
        video {
            position: absolute;
            width: 140%; height: 140%;
            object-fit: cover;
            left: -20%; top: -20%;
            will-change: transform;
            z-index: 1;
        }
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 25px 50px; background: #007bc4; color: white;
            font-size: 20px; border: none; border-radius: 15px; cursor: pointer; z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="btn" onclick="bootSecureEngine()">INITIALIZE PASSTHROUGH MR</button>

    <div id="container">
        <div class="eye">
            <video class="passthrough" autoplay playsinline muted></video>
            <canvas id="canvasLeft"></canvas>
        </div>
        <div class="eye">
            <video class="passthrough" autoplay playsinline muted></video>
            <canvas id="canvasRight"></canvas>
        </div>
    </div>

    <script>
        const vids = document.querySelectorAll('video');
        let scene, leftCam, rightCam, rendererLeft, rendererRight;
        let floatingPanel, spatialFloor;

        // Shared IMU and Computer Vision coordinate spaces
        let rx = 0, ry = 0, curX = 0, curY = 0;
        let trackX = 0, trackZ = -1.2;

        function build3DWorld() {
            scene = new THREE.Scene();

            // Setup custom split lens aspect cameras
            leftCam = new THREE.PerspectiveCamera(75, 1.77, 0.01, 30);
            leftCam.position.set(-0.03, 0, 0); // Correct real IPD offset shift

            rightCam = new THREE.PerspectiveCamera(75, 1.77, 0.01, 30);
            rightCam.position.set(0.03, 0, 0);

            // Bind independent renders to canvas sheets
            rendererLeft = new THREE.WebGLRenderer({ canvas: document.getElementById('canvasLeft'), alpha: true, antialias: true });
            rendererRight = new THREE.WebGLRenderer({ canvas: document.getElementById('canvasRight'), alpha: true, antialias: true });

            // High stability Quest-style green floor mesh grid
            spatialFloor = new THREE.GridHelper(12, 24, 0x00ff00, 0x113311);
            spatialFloor.position.y = -0.6;
            scene.add(spatialFloor);

            // Add the 3D target window panel asset
            const geometry = new THREE.BoxGeometry(0.3, 0.2, 0.01);
            const material = new THREE.MeshBasicMaterial({ color: 0x00aeff, wireframe: true });
            floatingPanel = new THREE.Mesh(geometry, material);
            floatingPanel.position.set(0, 0, -1.2);
            scene.add(floatingPanel);
        }

        async function bootSecureEngine() {
            // Check if page meets basic cryptographic secure context parameters
            if (!window.isSecureContext) {
                alert("CRITICAL WARNING: Web Camera pipelines require an HTTPS:// secure context link connection to function. Please switch hosts.");
            }

            document.getElementById('btn').style.display = 'none';
            document.documentElement.requestFullscreen().catch(() => {});

            build3DWorld();

            try {
                // Phase 1: Try to pull device lists directly
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoInputs = devices.filter(d => d.kind === 'videoinput');
                
                let bestLensId = null;
                
                // Advanced matching loop looking specifically for ultra-wide hardware nodes
                for (let dev of videoInputs) {
                    const name = dev.label.toLowerCase();
                    if (name.includes('ultra') || name.includes('wide') || name.includes('0.5x') || name.includes('back 2')) {
                        bestLensId = dev.deviceId;
                        break;
                    }
                }

                // If labels are blanked out by permission restrictions, pick the last indexed rear camera (typically ultra-wide)
                if (!bestLensId && videoInputs.length > 1) {
                    bestLensId = videoInputs[videoInputs.length - 1].deviceId;
                }

                const setupConstraints = {
                    audio: false,
                    video: bestLensId ? {
                        deviceId: { exact: bestLensId },
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 60 }
                    } : {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(setupConstraints);
                
                // Mirror stream out smoothly to both eye screens simultaneously
                vids.forEach(v => {
                    v.srcObject = stream;
                    // Force playback constraints
                    v.setAttribute('autoplay', 'true');
                    v.setAttribute('playsinline', 'true');
                    v.play();
                });

                // Lock down continuous autofocus loop hooks directly at the hardware driver layer
                const track = stream.getVideoTracks()[0];
                if (track && track.getCapabilities) {
                    const capabilities = track.getCapabilities();
                    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    }
                }

            } catch (cameraError) {
                console.error("Primary ultra-wide camera hook denied. Booting generic fallback channel:", cameraError);
                // Safe recovery loop configuration to guarantee screen output
                const safeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                vids.forEach(v => { v.srcObject = safeStream; v.play(); });
            }

            // Setup internal IMU sensor array matrices
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(runSensors).catch(() => runSensors());
            } else {
                runSensors();
            }

            initOpticalVIOPipeline(vids[0]);
            requestAnimationFrame(coreRenderEngineLoop);
        }

        function runSensors() {
            window.addEventListener('deviceorientation', (e) => {
                if(e.gamma === null || e.beta === null) return;
                rx = e.gamma * -0.85;
                ry = (e.beta - 75) * -0.85;
                
                const frameCap = 40;
                rx = Math.max(-frameCap, Math.min(frameCap, rx));
                ry = Math.max(-frameCap, Math.min(frameCap, ry));
            });
        }

        function initOpticalVIOPipeline(masterVideoSource) {
            const handTracker = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            handTracker.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.4,
                minTrackingConfidence: 0.4
            });

            handTracker.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const joints = results.multiHandLandmarks[0];
                    const baseWrist = joints[0];
                    const pointerTip = joints[8];

                    // Process depth metrics ($Z$) by reading wrist distance scaling from ultra-wide field
                    const depthZ = -1.1 / (baseWrist.z * -9.5 || 1);
                    
                    trackX += (((baseWrist.x - 0.5) * -1.9) - trackX) * 0.18;
                    trackZ += (depthZ - trackZ) * 0.18;

                    // Absolute coordinate calculation transformation mapping over virtual menu window space
                    const activeX = (pointerTip.x - 0.5) * 1.9;
                    const activeY = -(pointerTip.y - 0.5) * 1.3 + 0.25;
                    floatingPanel.position.set(activeX + trackX, activeY, -1.1 + trackZ);
                }
            });

            const processorThread = new Camera(masterVideoSource, {
                onFrame: async () => {
                    if (masterVideoSource.readyState >= 2) {
                        await handTracker.send({ image: masterVideoSource });
                    }
                },
                width: 480,
                height: 360
            });
            processorThread.start();
        }

        function coreRenderEngineLoop() {
            // Apply critical low-pass filters to smooth gyro ticks
            curX += (rx - curX) * 0.1;
            curY += (ry - curY) * 0.1;

            // Offset background arrays beneath 3D elements dynamically
            const transformString = `translate(${curX}px, ${curY}px)`;
            vids.forEach(v => v.style.transform = transformString);

            const headingY = (curX / 40) * 0.55;
            const headingX = (curY / 40) * 0.55;

            leftCam.rotation.set(headingX, headingY, 0, 'YXZ');
            rightCam.rotation.set(headingX, headingY, 0, 'YXZ');

            // Lock spatial tracking layout based on optical inputs
            spatialFloor.position.set(-trackX, -0.6, trackZ + 1.1);

            // Execute synchronous render outputs to maintain the side-by-side layout
            rendererLeft.render(scene, leftCam);
            rendererRight.render(scene, rightCam);

            requestAnimationFrame(coreRenderEngineLoop);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant AR Ground Tracker</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; color: white; display: flex; flex-direction: column; height: 100vh; }
        model-viewer { width: 100%; height: 70%; background-color: #222; }
        .ui { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn { 
            padding: 15px; border-radius: 12px; border: none; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; font-size: 16px;
        }
        #pick-btn { background: #333; color: white; border: 1px solid #555; }
        #ar-button { 
            background: #00ff00; color: black; display: none; 
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        #instructions { font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <model-viewer id="viewer" 
                  ar 
                  ar-modes="scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  ar-placement="floor">
        
        <button slot="ar-button" id="ar-button" class="btn">
            ✨ Place in your room
        </button>
    </model-viewer>

    <div class="ui">
        <button id="pick-btn" class="btn">📂 Pick 3D Model (.glb)</button>
        <input type="file" id="file-input" accept=".glb,.gltf" style="display: none;">
        
        <div id="instructions">
            Select a GLB from your downloads, then tap "Place in your room."
        </div>
    </div>

    <script>
        const modelViewer = document.querySelector('#viewer');
        const fileInput = document.querySelector('#file-input');
        const pickBtn = document.querySelector('#pick-btn');
        const arBtn = document.querySelector('#ar-button');

        // Allow user to pick a model from their phone
        pickBtn.onclick = () => fileInput.click();

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                modelViewer.src = url; // Load into the 3D viewer
                arBtn.style.display = 'block'; // Show the AR button
                pickBtn.innerText = "Model Loaded ✅";
            }
        });
    </script>
</body>
</html>

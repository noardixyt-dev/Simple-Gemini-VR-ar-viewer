<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1:1 Scale VR Passthrough</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #container {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            /* Adjust this to line up with your headset lenses */
            transform: translateX(-55px); 
        }

        .eye {
            /* SHRUNK WINDOWS: This "portals" the 1x camera 
               so it doesn't look giant through your VR lenses */
            height: 32vh; 
            width: calc(32vh * 1.77); 
            position: relative;
            overflow: hidden; 
            border-radius: 25px; 
            margin: 0 35px; /* Nose bridge gap */
            background: #000;
            border: 1px solid #333;
        }

        video {
            position: absolute;
            /* We keep the video slightly larger than the eye for stabilization,
               but NOT zoomed in. Object-fit: contain keeps the 1:1 scale better. */
            width: 120%;
            height: 120%;
            object-fit: cover;
            left: -10%;
            top: -10%;
            will-change: transform;
        }

        #ui {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 1000;
        }

        button {
            padding: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="ui"><button onclick="startVR()">START VR</button></div>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        const vids = document.querySelectorAll('video');
        let lx = 0, ly = 0;

        async function startVR() {
            document.getElementById('ui').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            try {
                // Requesting 60fps and 1080p for the best clarity
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 1920, height: 1080, frameRate: 60 }
                });
                vids.forEach(v => v.srcObject = stream);
            } catch (e) { alert("Camera access denied."); }

            // Permission for Motion Sensors
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(setupMotion);
            } else {
                setupMotion('granted');
            }
        }

        function setupMotion(state) {
            if (state === 'granted') {
                window.addEventListener('deviceorientation', (e) => {
                    // STABILIZATION
                    // This "absorbs" the vibrations but keeps the view centered.
                    // Multiplier 2.5 is aggressive enough for walking/shaking.
                    const moveX = (e.gamma - lx) * -2.5;
                    const moveY = (e.beta - ly) * -2.5;

                    vids.forEach(v => {
                        v.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });

                    lx = e.gamma;
                    ly = e.beta;
                });
            }
        }
    </script>
</body>
</html>

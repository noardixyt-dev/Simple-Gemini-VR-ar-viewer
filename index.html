<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Floaty VR Passthrough</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #container { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; 
            /* Your 5px left shift + V:10 height offset */
            transform: translate(-5px, 10px); 
        }

        .eye {
            /* INCREASED WINDOW SIZE: 
               Moving from 31vh to 45vh for better FOV */
            height: 45vh; 
            width: calc(45vh * 1.77); 
            position: relative; overflow: hidden; border-radius: 40px; 
            background: #000;
            /* Your S:24 Spacing */
            margin: 0 24px; 
        }

        video {
            position: absolute; 
            /* Shrinking the internal video to 115% 
               This keeps the scale LIFE-SIZE even with a larger window */
            width: 115%; height: 115%;
            object-fit: cover; 
            left: -7.5%; top: -7.5%;
            will-change: transform;
        }

        #start-overlay {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }

        #start-btn {
            padding: 25px 50px; background: #333; color: white;
            border: 2px solid #555; border-radius: 15px; font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <button id="start-btn" onclick="launch()">START FLOATY-VISION</button>
    </div>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        const vids = document.querySelectorAll('video');
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        async function launch() {
            document.getElementById('start-overlay').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: 1920, height: 1080, frameRate: 60 }
            });
            vids.forEach(vid => vid.srcObject = stream);

            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') window.addEventListener('deviceorientation', updateTarget);
                });
            } else {
                window.addEventListener('deviceorientation', updateTarget);
            }
            
            render();
        }

        function updateTarget(e) {
            // Gyroscope is much "floatier" than the accelerometer
            // Multiplier reduced to 1.5 for a natural dampening effect
            targetX = e.gamma * -1.5;
            targetY = (e.beta - 75) * -1.5;
        }

        function render() {
            // LERP (Linear Interpolation) 
            // 0.1 makes it very floaty/dampened. 0.3 would be stiffer.
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            const t = `translate(${currentX}px, ${currentY}px)`;
            vids.forEach(v => v.style.transform = t);

            requestAnimationFrame(render);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quest-Style Mixed Reality Engine</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }
        #xr-button {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background-color: #007bc4; color: white;
            border: none; border-radius: 10px; cursor: pointer;
            z-index: 100; shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="xr-button">ENTER QUEST-MODE MR</button>

    <script>
        let scene, camera, renderer, xrSession = null;
        const xrButton = document.getElementById('xr-button');

        function initCore3D() {
            // Setup the 3D scene where your grid and menus live
            scene = new THREE.Scene();

            // Create a camera. WebXR will completely take this over and apply 
            // true 6DoF movement based on your phone's camera tracking.
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // WebGL Renderer with alpha enabled so the real world shows behind the 3D items
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio to prevent overheating
            renderer.xr.enabled = true; 
            document.body.appendChild(renderer.domElement);

            // Add a highly visible, Quest-style spatial floor grid
            // This grid stays perfectly locked to your physical floor as you move
            const gridHelper = new THREE.GridHelper(20, 40, 0x00ff00, 0x224422);
            gridHelper.position.y = -1.6; // Locks approximately to real-world floor level
            scene.add(gridHelper);

            // Add a sample 3D Floating Menu Panel in space
            const geometry = new THREE.BoxGeometry(0.5, 0.3, 0.02);
            const material = new THREE.MeshBasicMaterial({ color: 0x00aeff, wireframe: true });
            const floatingMenu = new THREE.Mesh(geometry, material);
            floatingMenu.position.set(0, 0, -1.5); // Placed exactly 1.5 meters in front of your headset
            scene.add(floatingMenu);

            // Core WebXR Render Loop running at native hardware frame rate (60Hz / 90Hz)
            renderer.setAnimationLoop((timestamp, frame) => {
                if (frame) {
                    // WebXR is actively tracking your head position here via the phone camera.
                    // The renderer automatically handles the side-by-side split screen for your lenses.
                    renderer.render(scene, camera);
                }
            });
        }

        async function checkWebXR() {
            if ('xr' in navigator) {
                // 'immersive-ar' forces native camera passthrough background automatically
                const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (isSupported) {
                    xrButton.addEventListener('click', toggleXRSession);
                } else {
                    xrButton.textContent = "Your browser doesn't support Immersive AR";
                }
            } else {
                xrButton.textContent = "WebXR API not found (Use Chrome/Opera on Android)";
            }
        }

        async function toggleXRSession() {
            if (!xrSession) {
                try {
                    // Request session with 'local-floor' to enable native hardware world tracking
                    xrSession = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['local-floor'],
                        optionalFeatures: ['hand-tracking'] // Requests native hand joints if hardware supports it
                    });
                    
                    xrButton.style.display = 'none';
                    renderer.xr.setSession(xrSession);
                    
                    xrSession.addEventListener('end', () => {
                        xrSession = null;
                        xrButton.style.display = 'block';
                    });
                } catch (error) {
                    console.error("Failed to boot WebXR engine:", error);
                    alert("XR entry denied. Ensure camera permissions are allowed.");
                }
            }
        }

        // Initialize setup cleanly
        initCore3D();
        checkWebXR();

        // Handle viewport adjustments if device rotates before launching
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

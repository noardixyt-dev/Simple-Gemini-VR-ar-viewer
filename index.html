<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6DoF Relocatable Anchor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #v { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 10px; font-size: 11px; z-index: 10; border: 1px solid #0f0; color: #0f0; pointer-events: none; }
        #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 320px; z-index: 20; }
        .btn { padding: 18px; background: #0f0; color: #000; border: none; font-weight: bold; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="v" playsinline muted></video>
    <div id="ui">SYSTEM: READY<br>TAP TO MOVE MODEL</div>

    <div id="controls">
        <button id="start-btn" class="btn">1. Start System</button>
        <button id="load-btn" class="btn" style="display:none;">2. Load Model</button>
        <input type="file" id="file-input" accept=".glb,.gltf">
    </div>

    <script>
        let scene, camera, renderer, world, model;
        let pos = new THREE.Vector3(0, 0, 0);
        let rot = new THREE.Quaternion();

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 4096 } } 
            });
            document.getElementById('v').srcObject = stream;
            document.getElementById('v').play();

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            world = new THREE.Group();
            scene.add(world);
            world.add(new THREE.AmbientLight(0xffffff, 2));

            window.addEventListener('deviceorientation', (e) => {
                const euler = new THREE.Euler(THREE.MathUtils.degToRad(e.beta), THREE.MathUtils.degToRad(e.alpha), -THREE.MathUtils.degToRad(e.gamma), 'YXZ');
                rot.setFromEuler(euler);
            });

            window.addEventListener('devicemotion', (e) => {
                let a = e.acceleration;
                pos.x += a.x * 0.005; pos.z -= a.z * 0.005;
            });

            // RELOCATION LOGIC: Tap to "Pick up and drop" the model in front of you
            window.addEventListener('click', () => {
                if (model) {
                    // Create a point 2 meters in front of the camera's current direction
                    const target = new THREE.Vector3(0, 0, -2);
                    target.applyQuaternion(camera.quaternion);
                    
                    // Move the model to the camera position + the forward vector
                    model.position.copy(camera.position).add(target);
                    // Keep it on the "table level" (usually about -1 meter from eye level)
                    model.position.y = -1; 
                }
            });

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('load-btn').style.display = 'block';
            animate();
        }

        const fileInput = document.getElementById('file-input');
        document.getElementById('load-btn').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            new THREE.GLTFLoader().load(url, (gltf) => {
                if(model) world.remove(model);
                model = gltf.scene;
                model.position.set(0, -1, -3); 
                world.add(model);
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            camera.quaternion.slerp(rot, 0.1); 
            camera.position.lerp(pos, 0.1);
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').onclick = () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(init);
            } else { init(); }
        };
    </script>
</body>
</html>

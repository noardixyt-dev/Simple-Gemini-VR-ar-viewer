<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone VR with 6DOF & Passthrough</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #106ebe;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Phone VR Experience</h2>
        <p id="status">Loading...</p>
        <button id="startBtn">Start VR Session</button>
        <button id="passthroughBtn">Toggle Passthrough</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        let xrSession = null;
        let xrRefSpace = null;
        let passthroughActive = false;

        async function initXR() {
            if (!navigator.xr) {
                statusEl.textContent = 'WebXR not supported';
                return;
            }

            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (supported) {
                    statusEl.textContent = 'Ready to start VR session';
                } else {
                    statusEl.textContent = 'VR not supported on this device';
                }
            } catch (e) {
                statusEl.textContent = 'Error: ' + e.message;
            }
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                xrSession = await navigator.xr.requestSession('immersive-vr', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['dom-overlay', 'dom-overlay-for-handheld-ar'],
                    domOverlay: { root: document.body }
                });

                xrRefSpace = await xrSession.requestReferenceSpace('local-floor');
                statusEl.textContent = 'VR Session Active';
                xrSession.requestAnimationFrame(onXRFrame);
            } catch (e) {
                statusEl.textContent = 'Failed to start VR: ' + e.message;
            }
        });

        document.getElementById('passthroughBtn').addEventListener('click', () => {
            passthroughActive = !passthroughActive;
            document.getElementById('passthroughBtn').textContent = passthroughActive 
                ? 'Passthrough: ON' 
                : 'Passthrough: OFF';
        });

        function onXRFrame(time, frame) {
            const session = frame.session;
            const pose = frame.getViewerPose(xrRefSpace);

            if (pose) {
                renderVR(frame, pose);
            }

            session.requestAnimationFrame(onXRFrame);
        }

        function renderVR(frame, pose) {
            const glLayer = frame.session.renderState.baseLayer;
            const Width = glLayer.framebufferWidth;
            const height = glLayer.framebufferHeight;

            if (passthroughActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, Width, height);
            }

            ctx.fillStyle = '#0078d4';
            ctx.fillRect(pose.transform.position.x * 100 + Width / 2, 
                        pose.transform.position.y * 100 + height / 2, 
                        50, 50);

            ctx.fillStyle = 'white';
            ctx.font = '20px Arial';
            ctx.fillText(`Position: ${pose.transform.position.x.toFixed(2)}, ${pose.transform.position.y.toFixed(2)}`, 20, 40);
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initXR();
    </script>
</body>
</html>

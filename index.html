<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>6DoF Dual-Eye Mixed Reality Engine</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #start-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 25px 50px; font-size: 22px; font-weight: bold; background: #007bc4;
            color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 9999;
        }
        /* Hidden passthrough video element used to feed the hand tracker and background */
        #passthrough-video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <button id="start-btn" onclick="initializeMR()">START 6DoF MR MODE</button>
    <video id="passthrough-video" autoplay playsinline muted></video>

    <a-scene vr-mode-ui="enabled: true" loading-screen="enabled: false">
        
        <a-assets>
            <canvas id="camera-canvas" width="1024" height="512"></canvas>
        </a-assets>

        <a-entity id="camera-rig" position="0 1.6 0">
            <a-camera id="user-head" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>
        </a-entity>

        <a-grid position="0 0 0" cell-size="0.5" section-size="2" color="#00ff00" distance="15"></a-grid>

        <a-box id="mr-menu" position="0 1.4 -1.2" width="0.5" height="0.3" depth="0.02" color="#00aeff" material="wireframe: true"></a-box>

        <a-sky src="#camera-canvas" rotation="0 90 0"></a-sky>

    </a-scene>

    <script>
        const videoElement = document.getElementById('passthrough-video');
        const canvasElement = document.getElementById('camera-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const userHead = document.getElementById('user-head');
        const mrMenu = document.getElementById('mr-menu');
        
        let positionX = 0, positionY = 1.6, positionZ = 0;

        async function initializeMR() {
            document.getElementById('start-btn').style.display = 'none';
            
            // Request low-latency rear-facing environment camera
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: 60 }
            });
            videoElement.srcObject = stream;

            // Trigger stereoscopic headset split screen mode natively inside A-Frame
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.is('vr-mode')) {
                sceneEl.enterVR();
            } else {
                sceneEl.addEventListener('loaded', () => sceneEl.enterVR());
            }

            initTrackingPipeline();
        }

        function initTrackingPipeline() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                // 1. Process the Passthrough Camera frame onto the background canvas skybox
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                // 2. Fallback 6DoF Optical Flow Tracking (Quest-Style Camera Space Positioning)
                // If the user moves side-to-side, we adjust the camera position manually to simulate 6DoF
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const hand = results.multiHandLandmarks[0];
                    const wrist = hand[0]; // Wrist landmark provides steady spatial anchoring
                    const indexTip = hand[8]; // Index tip for direct menu tracking

                    // Calculate positional changes based on the scale of the wrist in the camera frame
                    let zEstimate = -1.0 / (wrist.z * -10 || 1); 
                    positionX = (wrist.x - 0.5) * -2.0;
                    positionZ = zEstimate;

                    // Apply the calculated 6DoF coordinates to your headset's core head position target
                    userHead.setAttribute('position', `${positionX} ${positionY} ${positionZ}`);

                    // 3. Hand Tracking Over Menu Intersection
                    const menuX = (indexTip.x - 0.5) * 2;
                    const menuY = -(indexTip.y - 0.5) * 1.5 + 1.6;
                    mrMenu.setAttribute('position', `${menuX} ${menuY} -1.2`);
                }
            });

            // Feed camera frames to the calculation loop at a stable 60Hz rate
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            cameraUtils.start();
        }
    </script>
</body>
</html>

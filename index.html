<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6DoF World-Positioning Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; color: #fff; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 12px; border-radius: 8px; font-size: 11px; z-index: 10; border: 1px solid #0f0; pointer-events: none; line-height: 1.5; }
        #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 12px; width: 85%; max-width: 320px; z-index: 20; }
        .btn { padding: 18px; background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 14px; text-transform: uppercase; font-size: 13px; box-shadow: 0 4px 15px rgba(0,255,0,0.3); }
        #reset-btn { background: #fff; color: #000; display: none; }
        #file-input { display: none; }
        /* Video stays behind 3D world */
        #video-background { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; }
    </style>
</head>
<body>

    <div id="ui">
        <b>SYSTEM STATUS</b><br>
        6DoF: <span id="stat-6dof">OFFLINE</span><br>
        POSITION: <span id="stat-pos">0, 0, 0</span><br>
        MODEL: <span id="stat-model">NONE</span>
    </div>

    <div id="controls">
        <button id="start-btn" class="btn">1. Calibrate & Start AR</button>
        <button id="pick-btn" class="btn" style="display:none;">2. Load .GLB Model</button>
        <button id="reset-btn" class="btn">Reset Origin</button>
        <input type="file" id="file-input" accept=".glb,.gltf">
    </div>

    <video id="video-background" playsinline></video>

    <script>
        let scene, camera, renderer, model, mixer;
        let pos = new THREE.Vector3(0, 0, 0);
        let orient = new THREE.Quaternion();
        const clock = new THREE.Clock();

        async function startAR() {
            // 1. High-Res Camera Request (Fixed Aspect Ratio)
            const video = document.getElementById('video-background');
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 4096 }, height: { ideal: 2160 } } 
            });
            video.srcObject = stream;
            await video.play();

            // 2. Three.js Initialization
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting for Realistic Models
            scene.add(new THREE.AmbientLight(0xffffff, 1));
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(5, 10, 7);
            scene.add(sun);

            // 3. Sensor Fusion (Inertial Odometry)
            window.addEventListener('deviceorientation', (e) => {
                const alpha = THREE.MathUtils.degToRad(e.alpha);
                const beta = THREE.MathUtils.degToRad(e.beta);
                const gamma = THREE.MathUtils.degToRad(e.gamma);
                
                // Construct orientation (Z-X-Y order for phone tracking)
                const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
                orient.setFromEuler(euler);
                document.getElementById('stat-6dof').innerText = "LOCKED";
            });

            window.addEventListener('devicemotion', (e) => {
                let acc = e.acceleration;
                // Simple motion integration for translation
                if(Math.abs(acc.x) > 0.1) pos.x += acc.x * 0.005;
                if(Math.abs(acc.z) > 0.1) pos.z -= acc.z * 0.005;
                
                document.getElementById('stat-pos').innerText = 
                    `${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}`;
            });

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('pick-btn').style.display = 'block';
            document.getElementById('reset-btn').style.display = 'block';
            
            animate();
        }

        // 4. File Picker & Loader
        const fileInput = document.getElementById('file-input');
        document.getElementById('pick-btn').onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const loader = new THREE.GLTFLoader();
            
            if(model) scene.remove(model);

            loader.load(url, (gltf) => {
                model = gltf.scene;
                // Place 2 meters in front of the camera
                model.position.set(pos.x, -1.5, pos.z - 2); 
                scene.add(model);
                document.getElementById('stat-model').innerText = file.name;
            });
        };

        // Reset tracking origin
        document.getElementById('reset-btn').onclick = () => {
            pos.set(0, 0, 0);
            if(model) model.position.set(0, -1.5, -2);
        };

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // Apply 6DoF values to Camera
            camera.quaternion.copy(orient);
            camera.position.lerp(pos, 0.1); // Linear interpolation for smoothness

            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').onclick = () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(startAR);
            } else {
                startAR();
            }
        };
    </script>
</body>
</html>

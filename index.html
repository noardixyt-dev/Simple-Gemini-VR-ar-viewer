<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Passthrough</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #container {
            display: flex;
            width: 100vw; height: 100vh;
        }

        .eye {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 40px; /* Rounded corners */
            margin: 10px;
            background: #111;
        }

        video {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Highly Visible Toggle Button */
        #fsToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: red; /* Bright color to find it easily */
            color: white;
            border: none;
            border-radius: 50%;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Hide everything if in portrait */
        @media screen and (orientation: portrait) {
            #container, #fsToggle { display: none; }
            body::after {
                content: "Rotate to Landscape";
                color: white;
                font-family: sans-serif;
            }
        }
    </style>
</head>
<body>

    <button id="fsToggle">GO</button>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        const btn = document.getElementById('fsToggle');
        const v1 = document.getElementById('v1');
        const v2 = document.getElementById('v2');

        // Camera Access
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 1280, height: 720 }
                });
                v1.srcObject = stream;
                v2.srcObject = stream;
            } catch (e) {
                alert("Camera failed: " + e.message);
            }
        }

        // Robust Fullscreen Toggle
        btn.addEventListener('click', () => {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                requestFullScreen.call(docEl);
                btn.style.opacity = "0.2"; // Fade out when active
                btn.innerText = "X";
            } else {
                cancelFullScreen.call(doc);
                btn.style.opacity = "1";
                btn.innerText = "GO";
            }
        });

        init();
    </script>
</body>
</html>

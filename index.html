<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Back-Cam VIO</title>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        #start-btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; font-size: 20px; z-index: 100;
        }
    </style>
</head>
<body>
    <button id="start-btn">LAUNCH BACK-CAM AR</button>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { XRButton } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/webxr/XRButton.js';

        const btn = document.getElementById('start-btn');
        btn.onclick = async () => {
            btn.style.display = 'none';
            
            // 1. Force back-facing environment camera access
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: 'environment' } }
            });
            stream.getTracks().forEach(track => track.stop()); // Just need the permission

            // 2. Setup Scene
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 0.2, 0.2),
                new THREE.MeshNormalMaterial()
            );
            cube.position.set(0, 0, -0.5);
            scene.add(cube);

            document.body.appendChild(XRButton.createButton(renderer, {
                requiredFeatures: ['hit-test', 'local-floor']
            }));

            renderer.setAnimationLoop(() => {
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            });
        };
    </script>
</body>
</html>

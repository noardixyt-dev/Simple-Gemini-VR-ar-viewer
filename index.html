<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Passthrough 70pct</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #container {
            display: flex;
            /* Die Augen werden als Gruppe leicht nach links verschoben */
            transform: translateX(-30px); 
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .eye {
            /* 70% der Viewport-Breite/Höhe kombiniert mit Flex-Basis */
            width: 35vw; 
            height: 70vh; 
            position: relative;
            overflow: hidden;
            border-radius: 60px; /* Abgerundete Ecken passend zur Größe */
            margin: 5px; /* Abstand zwischen den Augen */
            background: #000;
            border: 1px solid #333;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Sehr kleiner, unauffälliger Fullscreen-Button */
        #fsToggle {
            position: fixed;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            z-index: 9999;
            font-size: 8px;
            cursor: pointer;
        }

        @media screen and (orientation: portrait) {
            #container, #fsToggle { display: none; }
            body::after {
                content: "Bitte Querformat nutzen";
                color: white;
                font-family: sans-serif;
            }
        }
    </style>
</head>
<body>

    <button id="fsToggle" onclick="toggleFS()">FS</button>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment", 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 } 
                    }
                });
                document.getElementById('v1').srcObject = stream;
                document.getElementById('v2').srcObject = stream;
            } catch (err) {
                console.error(err);
            }
        }

        function toggleFS() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        start();
    </script>
</body>
</html>

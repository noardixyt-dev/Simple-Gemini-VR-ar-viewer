<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True 6DoF Hardware VIO Split-Screen</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
        }
        #container {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            /* Your hard-coded physical headset calibration offsets */
            transform: translate(-5px, 10px); 
        }
        .eye {
            height: 45vh;
            width: calc(45vh * 1.77);
            position: relative; overflow: hidden; border-radius: 40px;
            background: #000;
            margin: 0 24px; /* S:24 lens gap */
            border: 1px solid #222;
        }
        canvas {
            width: 100%; height: 100%;
        }
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 25px 50px; background: #007bc4; color: white;
            font-size: 20px; border: none; border-radius: 15px; cursor: pointer; z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="btn" onclick="startVIO()">START HARDWARE 6DoF SBS</button>

    <div id="container">
        <div class="eye"><canvas id="leftCanvas"></canvas></div>
        <div class="eye"><canvas id="rightCanvas"></canvas></div>
    </div>

    <script>
        let scene, leftCam, rightCam, rendererLeft, rendererRight;
        let mainCube, floorGrid;

        function initScene() {
            scene = new THREE.Scene();

            // Set up native hardware video background texture
            const video = document.createElement('video');
            video.autoplay = true;
            video.playsinline = true;
            
            // Force hardware Autofocus, stable frame rates, and high resolution
            navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: "environment", 
                    width: { ideal: 1920 }, 
                    height: { ideal: 1080 },
                    frameRate: { ideal: 60 },
                    focusMode: "continuous" // Direct hardware instruction for continuous autofocus
                }
            }).then(stream => {
                video.srcObject = stream;
                // Lock autofocus via tracks if supported by device browser
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            });

            const videoTexture = new THREE.VideoTexture(video);
            scene.background = videoTexture;

            // Setup stereoscopic dual cameras (IPD shifted)
            leftCam = new THREE.PerspectiveCamera(70, 1.77, 0.01, 20);
            rightCam = new THREE.PerspectiveCamera(70, 1.77, 0.01, 20);

            // Separate eye renderers linked to your calibrated HTML structure
            rendererLeft = new THREE.WebGLRenderer({ canvas: document.getElementById('leftCanvas'), antialias: true });
            rendererRight = new THREE.WebGLRenderer({ canvas: document.getElementById('rightCanvas'), antialias: true });

            // Create an object locked to the tracking grid space
            const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
            mainCube = new THREE.Mesh(geometry, material);
            mainCube.position.set(0, 0, -1.5); // Fixed 1.5 meters out in space
            scene.add(mainCube);

            // True Quest-style floor grid
            floorGrid = new THREE.GridHelper(10, 20, 0xff0000, 0x441111);
            floorGrid.position.y = -1.0;
            scene.add(floorGrid);
        }

        function startVIO() {
            document.getElementById('btn').style.display = 'none';
            document.documentElement.requestFullscreen();
            
            initScene();

            // Intercept native browser WebXR session ONLY for its hardware 6DoF VIO data matrix
            navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['local-floor'] }).then(session => {
                const glContext = rendererLeft.getContext();
                
                // Secret Hack: We make an invisible WebGL reference layer to steal tracking updates
                session.updateRenderState({ baseLayer: new XRWebGLLayer(session, glContext) });
                
                const referenceSpace = session.requestReferenceSpace('local-floor').then(refSpace => {
                    session.requestAnimationFrame(function onFrame(time, frame) {
                        session.requestAnimationFrame(onFrame);
                        
                        const pose = frame.getViewerPose(refSpace);
                        if (pose) {
                            // Extract TRUE 6DoF hardware position matrix tracking directly from your phone's VIO core
                            const position = pose.transform.position;
                            const orientation = pose.transform.orientation;

                            const internalRotation = new THREE.Quaternion(orientation.x, orientation.y, orientation.z, orientation.w);

                            // Apply the absolute hardware coordinates to Left Eye Camera
                            leftCam.position.set(position.x - 0.03, position.y, position.z);
                            leftCam.quaternion.copy(internalRotation);

                            // Apply the absolute hardware coordinates to Right Eye Camera
                            rightCam.position.set(position.x + 0.03, position.y, position.z);
                            rightCam.quaternion.copy(internalRotation);

                            // Keep the object rotating smoothly relative to the tracking grid frame
                            mainCube.rotation.y += 0.01;

                            // Force synchronous dual-canvas execution
                            rendererLeft.render(scene, leftCam);
                            rendererRight.render(scene, rightCam);
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>

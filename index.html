<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: white; background: rgba(0,0,0,0.7); padding: 15px; pointer-events: none; }
        #btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">Move phone to scan floor</div>
    <button id="btn">START AR</button>

    <script>
        let renderer, scene, camera, reticle, hitTestSource;

        async function start() {
            const session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"] });
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera();

            // The Tracker Ring
            reticle = new THREE.Mesh(new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial());
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Tap to place object
            session.addEventListener("select", () => {
                if (reticle.visible) {
                    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshNormalMaterial());
                    reticle.matrix.decompose(cube.position, cube.quaternion, cube.scale);
                    scene.add(cube);
                }
            });

            renderer.xr.setSession(session);
            const ref = await session.requestReferenceSpace("local");
            const viewer = await session.requestReferenceSpace("viewer");
            hitTestSource = await session.requestHitTestSource({ space: viewer });

            renderer.setAnimationLoop((t, frame) => {
                if (!frame) return;
                const hitResults = frame.getHitTestResults(hitTestSource);
                if (hitResults.length > 0) {
                    reticle.visible = true;
                    reticle.matrix.fromArray(hitResults[0].getPose(ref).transform.matrix);
                    document.getElementById("ui").style.display = "none";
                } else {
                    reticle.visible = false;
                }
                renderer.render(scene, camera);
            });
            document.getElementById("btn").style.display = "none";
        }
        document.getElementById("btn").onclick = start;
    </script>
</body>
</html>

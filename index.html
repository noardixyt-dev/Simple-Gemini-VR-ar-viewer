<!DOCTYPE html>
<html>
<head>
    <title>6DoF Physical Anchor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video-feed { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 10px; font-size: 11px; z-index: 10; border: 1px solid #0f0; color: #0f0; pointer-events: none; }
        #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: 85%; max-width: 320px; z-index: 20; }
        .btn { padding: 18px; background: #0f0; color: #000; border: none; font-weight: bold; border-radius: 14px; cursor: pointer; text-transform: uppercase; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="video-feed" playsinline muted></video>
    <div id="ui">
        <b>WORLD ANCHOR:</b> <span id="stat">WAITING...</span><br>
        <b>POSITION:</b> <span id="pos-info">0, 0, 0</span><br>
        <i>Tap screen to pin object to your table</i>
    </div>

    <div id="controls">
        <button id="start-btn" class="btn">1. Start Solid Tracking</button>
        <button id="load-btn" class="btn" style="display:none;">2. Load .GLB Model</button>
        <input type="file" id="file-picker" accept=".glb,.gltf">
    </div>

    <script>
        let scene, camera, renderer, worldSpace, model;
        let phonePos = new THREE.Vector3(0, 0, 0);
        let phoneRot = new THREE.Quaternion();

        async function init() {
            // 1. High-Quality Passthrough
            const video = document.getElementById('video-feed');
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 4096 } } 
            });
            video.srcObject = stream;
            video.play();

            // 2. The Fixed "World" Scene
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Everything in worldSpace stays "glued" to the real room
            worldSpace = new THREE.Group();
            scene.add(worldSpace);
            worldSpace.add(new THREE.AmbientLight(0xffffff, 1.5));

            // 3. Sensor Fusion (6DoF)
            window.addEventListener('deviceorientation', (e) => {
                const euler = new THREE.Euler(THREE.MathUtils.degToRad(e.beta), THREE.MathUtils.degToRad(e.alpha), -THREE.MathUtils.degToRad(e.gamma), 'YXZ');
                phoneRot.setFromEuler(euler);
                document.getElementById('stat').innerText = "LOCKED TO SPACE";
            });

            window.addEventListener('devicemotion', (e) => {
                let a = e.acceleration;
                // These deltas track your physical movement in the room
                phonePos.x += a.x * 0.005; 
                phonePos.z -= a.z * 0.005;
                document.getElementById('pos-info').innerText = `${phonePos.x.toFixed(1)}, ${phonePos.z.toFixed(1)}`;
            });

            // 4. Tap-to-Place (Pins the object to a spot in the room)
            window.addEventListener('click', (event) => {
                if (!model) return;
                // Pin the model 2 meters in front of wherever you are currently standing
                const forward = new THREE.Vector3(0, 0, -2).applyQuaternion(phoneRot);
                model.position.copy(phonePos).add(forward);
                model.position.y = -1.6; // Anchor it to "Table/Floor" height
            });

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('load-btn').style.display = 'block';
            animate();
        }

        // GLB Loader
        const filePicker = document.getElementById('file-picker');
        document.getElementById('load-btn').onclick = () => filePicker.click();
        filePicker.onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            new THREE.GLTFLoader().load(url, (gltf) => {
                if(model) worldSpace.remove(model);
                model = gltf.scene;
                model.position.set(0, -1.6, -3); // Default placement
                worldSpace.add(model);
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            // We move the CAMERA (your phone) through the WORLD
            camera.quaternion.slerp(phoneRot, 0.1); 
            camera.position.lerp(phonePos, 0.1);
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').onclick = () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(init);
            } else { init(); }
        };
    </script>
</body>
</html>

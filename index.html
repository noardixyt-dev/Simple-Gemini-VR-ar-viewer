<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AR Ground Lock</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        model-viewer { width: 100%; flex-grow: 1; }
        .controls { padding: 20px; background: #111; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #333; }
        .btn { width: 100%; padding: 20px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        #pick-btn { background: #444; color: white; }
        #ar-btn { background: #00ff00; color: #000; display: none; }
        #msg { text-align: center; font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <model-viewer id="mv" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor" 
        camera-controls 
        shadow-intensity="1" 
        environment-image="neutral"
        touch-action="pan-y">
        
        <div id="ar-prompt" slot="ar-button" style="display:none;"></div>
    </model-viewer>

    <div class="controls">
        <button id="pick-btn" class="btn">📂 1. SELECT DOWNLOADED .GLB</button>
        <button id="ar-btn" class="btn">🚀 2. PIN TO FLOOR</button>
        <input type="file" id="file-input" accept=".glb,.gltf" style="display: none;">
        <div id="msg">Model must be under 15MB for best tracking</div>
    </div>

    <script>
        const mv = document.querySelector('#mv');
        const fileIn = document.querySelector('#file-input');
        const arBtn = document.querySelector('#ar-btn');
        const pickBtn = document.querySelector('#pick-btn');

        pickBtn.onclick = () => fileIn.click();

        fileIn.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                mv.src = url;
                arBtn.style.display = 'block';
                pickBtn.innerText = "MODEL LOADED ✅";
            }
        };

        // This triggers the phone's native AR hardware
        arBtn.onclick = () => {
            mv.activateAR();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-ar-hit-test-component@1.0.0/dist/aframe-ar-hit-test-component.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene 
      webxr="optionalFeatures: hit-test, local-floor; referenceSpaceType: local-floor;"
      renderer="antialias: true; alpha: true;">
      
      <a-assets>
        <a-asset-item id="myModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-item>
      </a-assets>

      <a-entity id="cameraRig">
        <a-camera position="0 1.6 0"></a-camera>
      </a-entity>

      <a-entity ar-hit-test="target: #model-anchor; type: footprint;">
        <a-ring color="#00FF00" rotation="-90 0 0" radius-inner="0.1" radius-outer="0.15"></a-ring>
      </a-entity>

      <a-entity id="model-anchor" position="0 0 -1" visible="false">
        <a-entity 
          gltf-model="#myModel" 
          scale="0.5 0.5 0.5"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>
      </a-entity>

      <a-light type="ambient" intensity="0.5"></a-light>
      <a-light type="directional" position="1 1 1"></a-light>
    </a-scene>

    <script>
      // Logic to make the model stay visible once placed
      const reticle = document.querySelector('[ar-hit-test]');
      const model = document.querySelector('#model-anchor');

      window.addEventListener('click', () => {
        if (reticle.getAttribute('visible') !== false) {
          model.setAttribute('visible', 'true');
          // Copy reticle position to model for "anchoring"
          model.setAttribute('position', reticle.getAttribute('position'));
        }
      });
    </script>
  </body>
</html>

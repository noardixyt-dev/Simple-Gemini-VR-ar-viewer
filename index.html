<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6DoF Tap-to-Place Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #video-feed { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        #ui { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 10px; font-size: 11px; z-index: 10; border: 1px solid #0f0; color: #0f0; pointer-events: none; }
        #controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; width: 85%; max-width: 320px; z-index: 20; }
        .btn { padding: 18px; background: #0f0; color: #000; border: none; font-weight: bold; border-radius: 14px; cursor: pointer; text-transform: uppercase; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <video id="video-feed" playsinline muted></video>
    <div id="ui">
        <b>SYSTEM:</b> <span id="sys">OFFLINE</span><br>
        <b>LOCK:</b> <span id="lock">NONE</span><br>
        <i>Tap screen to move object</i>
    </div>

    <div id="controls">
        <button id="start-btn" class="btn">1. Start 6DoF Passthrough</button>
        <button id="load-btn" class="btn" style="display:none;">2. Load .GLB Model</button>
        <input type="file" id="file-picker" accept=".glb,.gltf">
    </div>

    <script>
        let scene, camera, renderer, worldSpace, model, raycaster, pointer;
        let pos = new THREE.Vector3(0, 0, 0);
        let orientation = new THREE.Quaternion();

        async function init() {
            const video = document.getElementById('video-feed');
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 4096 } } 
            });
            video.srcObject = stream;
            await video.play();

            // 3D Engine Initialization
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Spatial World Setup
            worldSpace = new THREE.Group();
            scene.add(worldSpace);
            worldSpace.add(new THREE.AmbientLight(0xffffff, 1.5));

            // Raycaster for Tapping
            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();

            // Sensor Fusion (6DoF)
            window.addEventListener('deviceorientation', (e) => {
                const euler = new THREE.Euler(THREE.MathUtils.degToRad(e.beta), THREE.MathUtils.degToRad(e.alpha), -THREE.MathUtils.degToRad(e.gamma), 'YXZ');
                orientation.setFromEuler(euler);
                document.getElementById('lock').innerText = "WORLD ANCHOR ACTIVE";
            });

            window.addEventListener('devicemotion', (e) => {
                let a = e.acceleration;
                pos.x += a.x * 0.005; pos.z -= a.z * 0.005;
                document.getElementById('sys').innerText = "TRACKING SPACE";
            });

            // Tap-to-Place Event
            window.addEventListener('click', onTouch);

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('load-btn').style.display = 'block';
            animate();
        }

        function onTouch(event) {
            if (!model) return;
            // Calculate tap position
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Shoot a ray 3 meters deep into your room
            raycaster.setFromCamera(pointer, camera);
            const targetPos = new THREE.Vector3();
            raycaster.ray.at(3, targetPos); 
            
            // Move the model to the tapped spot
            model.position.copy(targetPos);
        }

        // File Loading
        const filePicker = document.getElementById('file-picker');
        document.getElementById('load-btn').onclick = () => filePicker.click();
        filePicker.onchange = (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            new THREE.GLTFLoader().load(url, (gltf) => {
                if(model) worldSpace.remove(model);
                model = gltf.scene;
                model.position.set(0, 0, -3); // Default placement
                worldSpace.add(model);
            });
        };

        function animate() {
            requestAnimationFrame(animate);
            camera.quaternion.copy(orientation);
            camera.position.lerp(pos, 0.1); 
            renderer.render(scene, camera);
        }

        document.getElementById('start-btn').onclick = () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(init);
            } else { init(); }
        };
    </script>
</body>
</html>

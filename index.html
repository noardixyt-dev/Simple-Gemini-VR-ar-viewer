<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Locked-Float VR</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #container { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; 
            /* Hard-coded offsets from your calibration: S:24, V:10, and 5px Left */
            transform: translate(-5px, 10px); 
        }

        .eye {
            /* Height 45vh for better FOV as requested */
            height: 45vh; 
            width: calc(45vh * 1.77); 
            position: relative; overflow: hidden; border-radius: 40px; 
            background: #000;
            margin: 0 24px; /* S:24 */
            border: 1px solid #222;
        }

        video {
            position: absolute; 
            /* 130% size gives us a 15% safety 'bleed' on all sides 
               to move the image without showing black edges */
            width: 130%; height: 130%;
            object-fit: cover; 
            left: -15%; top: -15%;
            will-change: transform;
        }

        #overlay {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center;
        }

        button {
            padding: 30px 60px; background: #111; color: white;
            border: 2px solid #444; border-radius: 15px; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button onclick="launch()">START STABLE VIEW</button>
    </div>

    <div id="container">
        <div class="eye"><video id="v1" autoplay playsinline muted></video></div>
        <div class="eye"><video id="v2" autoplay playsinline muted></video></div>
    </div>

    <script>
        const vids = document.querySelectorAll('video');
        let tX = 0, tY = 0; // Target
        let cX = 0, cY = 0; // Current

        async function launch() {
            document.getElementById('overlay').style.display = 'none';
            document.documentElement.requestFullscreen();

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: 1920, height: 1080, frameRate: 60 }
            });
            vids.forEach(v => v.srcObject = stream);

            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(reg);
            } else { reg(); }
            
            requestAnimationFrame(loop);
        }

        function reg() {
            window.addEventListener('deviceorientation', (e) => {
                // We use a low multiplier (0.8) so it doesn't jump over the window edges
                // This keeps the "screen" mostly centered in front of your face
                tX = e.gamma * -0.8;
                tY = (e.beta - 75) * -0.8;

                // HARD CLAMP: This prevents the video from ever showing 50% of the window
                // It stops the image before the black background shows
                const limit = 40; 
                tX = Math.max(-limit, Math.min(limit, tX));
                tY = Math.max(-limit, Math.min(limit, tY));
            });
        }

        function loop() {
            // LERP smoothing: 0.08 makes it feel very heavy and dampened (OIS-like)
            cX += (tX - cX) * 0.08;
            cY += (tY - cY) * 0.08;

            const transform = `translate(${cX}px, ${cY}px)`;
            vids.forEach(v => v.style.transform = transform);

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>0.5x Native-Feel Matrix VIO Engine</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #container {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transform: translate(-5px, 10px); /* Custom lens physical calibration */
        }
        .eye {
            height: 45vh;
            width: calc(45vh * 1.77);
            position: relative; overflow: hidden; border-radius: 40px;
            background: #111;
            margin: 0 24px; /* S:24 headset lens gap */
            border: 1px solid #333;
        }
        .eye canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }
        #btn {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 25px 50px; background: #007bc4; color: white;
            font-size: 20px; font-weight: bold; border: none; border-radius: 15px; 
            cursor: pointer; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        #hardware-vault { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="btn" onclick="initializeVioEngine()">START NATIVE-FEEL MR</button>

    <div id="container">
        <div class="eye"><canvas id="viewLeft"></canvas></div>
        <div class="eye"><canvas id="viewRight"></canvas></div>
    </div>

    <div id="hardware-vault">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="masterCanvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const masterCanvas = document.getElementById('masterCanvas');
        const ctxLeft = document.getElementById('viewLeft').getContext('2d');
        const ctxRight = document.getElementById('viewRight').getContext('2d');

        let scene, camera, renderer, videoTexture;
        let trackedCube, alignmentGrid;

        // Mathematical State Estimator Vectors
        let gyroQuaternion = new THREE.Quaternion();
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        
        let positionX = 0, positionY = 0, positionZ = -1.2;

        function build3DMatrixWorld() {
            scene = new THREE.Scene();

            // Establish the primary mathematical camera container
            camera = new THREE.PerspectiveCamera(75, 1.77, 0.01, 50);
            camera.position.set(0, 0, 0);

            // Bind the 0.5x wide video stream to the 3D environment skybox mapping matrix
            videoTexture = new THREE.VideoTexture(video);
            scene.background = videoTexture;

            // Fire up high-performance engine context on the hidden processor canvas
            renderer = new THREE.WebGLRenderer({ canvas: masterCanvas, antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(1280, 720);

            // Quest-style positional verification floor grid
            alignmentGrid = new THREE.GridHelper(16, 32, 0x00ff00, 0x113311);
            alignmentGrid.position.y = -0.6; // Set standing height perspective index
            scene.add(alignmentGrid);

            // Target Tracking Cube
            const geometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            const material = new THREE.MeshBasicMaterial({ color: 0x00aeff, wireframe: true });
            trackedCube = new THREE.Mesh(geometry, material);
            trackedCube.position.set(0, -0.475, -1.2); // Aligned directly flush onto the green grid
            scene.add(trackedCube);
        }

        async function initializeVioEngine() {
            document.getElementById('btn').style.display = 'none';
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            // Find your hardware's 0.5x ultra-wide camera lens array profiles
            const devices = await navigator.mediaDevices.enumerateDevices();
            const inputs = devices.filter(d => d.kind === 'videoinput');
            let wideLensId = null;

            for (let device of inputs) {
                const checkLabel = device.label.toLowerCase();
                if (checkLabel.includes('ultra') || checkLabel.includes('wide') || checkLabel.includes('back 2') || checkLabel.includes('0.5x')) {
                    wideLensId = device.deviceId;
                    break;
                }
            }
            if (!wideLensId && inputs.length > 1) {
                wideLensId = inputs[inputs.length - 1].deviceId; // Select hardware secondary lens layout fallback
            }

            const configurations = {
                audio: false,
                video: wideLensId ? {
                    deviceId: { exact: wideLensId },
                    width: { ideal: 1280 },
                    height: { ideal: 720 },
                    frameRate: { ideal: 60 }
                } : {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            const mediaStream = await navigator.mediaDevices.getUserMedia(configurations);
            video.srcObject = mediaStream;
            video.play();

            // Lock constant hardware driver autofocus loops
            const track = mediaStream.getVideoTracks()[0];
            if (track && track.getCapabilities) {
                const structuralCapabilities = track.getCapabilities();
                if (structuralCapabilities.focusMode && structuralCapabilities.focusMode.includes('continuous')) {
                    await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            }

            build3DMatrixWorld();

            // Mount high-frequency low-latency hardware Inertial Measurement Unit (IMU) listeners
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', handleHardwareImuData, true);
            }

            requestAnimationFrame(coreStateEstimatorLoop);
        }

        function handleHardwareImuData(event) {
            if (event.gamma === null || event.beta === null) return;

            // Convert degrees to radians and calibrate for forward headset presentation geometry
            targetRotationX = (event.beta - 75) * (Math.PI / 180) * -0.9; 
            targetRotationY = event.gamma * (Math.PI / 180) * -0.9;
        }

        function coreStateEstimatorLoop() {
            // Apply a precise Low-Pass Filter (LPF) to smooth tracking transitions and counter hand tremors
            currentRotationX += (targetRotationX - currentRotationX) * 0.12;
            currentRotationY += (targetRotationY - currentRotationY) * 0.12;

            // Compute and commit Euler tracking coordinates to the camera matrix transformations
            camera.rotation.set(currentRotationX, currentRotationY, 0, 'YXZ');

            // Positional Tracking Matrix: Updates translation vectors to anchor the objects to your real floor
            trackedCube.position.set(-positionX, -0.475, positionZ);
            alignmentGrid.position.set(-positionX, -0.6, positionZ + 1.2);

            // Continuously rotate the test cube to confirm thread status execution
            trackedCube.rotation.y += 0.01;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                videoTexture.needsUpdate = true;
            }

            // Render out the complete combined world matrix space exactly once
            renderer.render(scene, camera);

            // Mirror Pipeline Action: Directly map the master output to both layout eyes concurrently
            const displayWidth = ctxLeft.canvas.width;
            const displayHeight = ctxLeft.canvas.height;

            ctxLeft.drawImage(masterCanvas, 0, 0, displayWidth, displayHeight);
            ctxRight.drawImage(masterCanvas, 0, 0, displayWidth, displayHeight);

            requestAnimationFrame(coreStateEstimatorLoop);
        }
    </script>
</body>
</html>

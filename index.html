<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>High-Quality VR Passthrough</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            flex-direction: row; /* Landscape split */
        }

        .view-container {
            width: 50%;
            height: 100%;
            overflow: hidden;
            position: relative;
            border-right: 1px solid #222; /* Divider line */
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
        }

        #ui-overlay {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <p>Please rotate to Landscape</p>
        <button onclick="startCamera()">Start High-Res VR</button>
    </div>

    <div class="view-container">
        <video id="videoLeft" autoplay playsinline muted></video>
    </div>

    <div class="view-container">
        <video id="videoRight" autoplay playsinline muted></video>
    </div>

    <script>
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: { exact: "environment" }, // Forces back camera
                    width: { ideal: 4096 }, // Requests 4K if available
                    height: { ideal: 2160 }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoLeft = document.getElementById('videoLeft');
                const videoRight = document.getElementById('videoRight');
                
                videoLeft.srcObject = stream;
                videoRight.srcObject = stream;

                // Hide UI after start
                document.getElementById('ui-overlay').style.display = 'none';

                // Attempt to go Fullscreen
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Could not access back camera. Make sure you are using HTTPS and have granted permissions.");
            }
        }
    </script>
</body>
</html>

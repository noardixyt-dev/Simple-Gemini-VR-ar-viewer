<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBS VR Passthrough</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
        }

        /* Landscape Check */
        @media screen and (orientation: portrait) {
            #warning { display: flex; }
            #container, #fullscreenBtn { display: none; }
        }

        #warning {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: black;
        }

        .eye {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 50px; /* YouTube VR Style */
            margin: 15px;
            background: #000;
        }

        video {
            position: absolute;
            height: 100%;
            width: 100%;
            object-fit: cover;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* Small Fullscreen Toggle */
        #fullscreenBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 5px;
            z-index: 100;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0.5;
        }

        #fullscreenBtn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="warning">Please rotate to Landscape</div>

    <div id="fullscreenBtn" onclick="toggleFullscreen()">⛶</div>

    <div id="container">
        <div class="eye"><video id="leftEye" autoplay playsinline muted></video></div>
        <div class="eye"><video id="rightEye" autoplay playsinline muted></video></div>
    </div>

    <script>
        // Camera Setup
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('leftEye').srcObject = stream;
                document.getElementById('rightEye').srcObject = stream;
            } catch (err) {
                alert("Camera error: " + err.name);
            }
        }

        // Fullscreen Logic
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        startCamera();
    </script>
</body>
</html>
